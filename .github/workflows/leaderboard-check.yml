name: Leaderboard offline checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/leaderboard-check.yml
      - .github/workflows/leaderboard-fetch.yml
      - leaderboard-fetch/**
      - fetch.py
      - sync.sh
      - additional-boards.js
      - additional-boards.test.mjs
      - app.js
      - product.js
      - research.js
      - money-format.js
      - home-data.js
      - index.html
      - leaderboard-ui.test.mjs
      - snapshot-time.js
      - snapshot-time.test.mjs
  pull_request:
    paths:
      - .github/workflows/leaderboard-check.yml
      - .github/workflows/leaderboard-fetch.yml
      - leaderboard-fetch/**
      - fetch.py
      - sync.sh
      - additional-boards.js
      - additional-boards.test.mjs
      - app.js
      - product.js
      - research.js
      - money-format.js
      - home-data.js
      - index.html
      - leaderboard-ui.test.mjs
      - snapshot-time.js
      - snapshot-time.test.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: leaderboard-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_name: ${{ steps.plan.outputs.candidate_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r leaderboard-fetch/requirements.txt
      - name: Test collection, validation and publication using local fixtures only
        run: python -m unittest discover -s leaderboard-fetch -p 'test_*.py'
      - name: Test leaderboard rendering and source time interpretation
        run: node --test additional-boards.test.mjs leaderboard-ui.test.mjs snapshot-time.test.mjs
      - name: Prepare artifact transfer fixture using the production planner
        id: plan
        run: |
          printf '%s\n' '{}' > "$RUNNER_TEMP/fixture-event.json"
          GITHUB_EVENT_NAME=workflow_dispatch GITHUB_EVENT_PATH="$RUNNER_TEMP/fixture-event.json" python leaderboard-fetch/plan.py
          mkdir -p "$RUNNER_TEMP/leaderboard-candidates"
          printf '%s\n' "leaderboard-candidates-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/leaderboard-candidates/marker.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.plan.outputs.candidate_name }}
          path: ${{ runner.temp }}/leaderboard-candidates/marker.txt
          if-no-files-found: error
          retention-days: 7

  artifact-transfer:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact producing attempt survives a consumer-only retry
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_NAME: ${{ needs.checks.outputs.candidate_name }}
        run: |
          test -n "$CANDIDATE_NAME"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CANDIDATE_NAME" --dir "$RUNNER_TEMP/leaderboard-candidates"
          test "$(cat "$RUNNER_TEMP/leaderboard-candidates/marker.txt")" = "$CANDIDATE_NAME"
          printf 'Consumer attempt %s verified %s\n' "$GITHUB_RUN_ATTEMPT" "$CANDIDATE_NAME" >> "$GITHUB_STEP_SUMMARY"
